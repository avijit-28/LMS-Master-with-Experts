# ==============================================================================
# EduPlatform LMS: Supporting Infrastructure Services (100% Free / Open Source)
# Stack: Redis 7, Qdrant Vector DB, RabbitMQ 3, Prometheus, Grafana OSS
# Orchestrated for Windows Workstation (IIS host on Windows + Docker Desktop / WSL 2)
# All service ports are bound strictly to 127.0.0.1 for maximum loopback security.
# ==============================================================================
version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Distributed Cache Layer (Exact Query & Cross-Worker Cache)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: lms-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ----------------------------------------------------------------------------
  # 2. Vector Database (Course Chunks, Syllabus Embeddings, Semantic Search)
  # ----------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: lms-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q \"200 OK\"'"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 3. Message Broker & Ingestion Task Queue (Decoupled PDF Extraction)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: lms-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=lms_admin
      - RABBITMQ_DEFAULT_PASS=lms_secure_queue_pass_2026
    ports:
      - "127.0.0.1:5672:5672"       # AMQP internal protocol port
      - "127.0.0.1:15672:15672"   # Management Web UI (local admin only)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------------------------
  # 4. Metrics Scraper & Time-Series Engine
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: lms-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 3s
      retries: 3

  # ----------------------------------------------------------------------------
  # 5. Operational Dashboards & Real-Time Telemetry
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana-oss:10.4.0
    container_name: lms-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_grafana_pass_2026
      - GF_USERS_ALLOW_SIGN_UP=false
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
